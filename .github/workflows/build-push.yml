name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: ubuntu-mcp
            context: ./mcp-servers/ubuntu-server
            dockerfile: ./mcp-servers/ubuntu-server/Dockerfile
            build-args: |
              PERMISSION_ENGINE_PATH=shared/mcp-permission-engine
          - name: obsidian-mcp
            context: ./mcp-servers/obsidian
            dockerfile: ./mcp-servers/obsidian/Dockerfile
            build-args: |
              PERMISSION_ENGINE_PATH=shared/mcp-permission-engine
          - name: synology-mcp
            context: ./mcp-servers/synology-nas
            dockerfile: ./mcp-servers/synology-nas/Dockerfile
            build-args: |
              PERMISSION_ENGINE_PATH=shared/mcp-permission-engine
          - name: github-mcp
            context: ./mcp-servers/github
            dockerfile: ./mcp-servers/github/Dockerfile
            build-args: |
              PERMISSION_ENGINE_PATH=shared/mcp-permission-engine
              PROXY_PATH=shared/mcp-proxy
          - name: mcp-webui
            context: ./mcp-webui
            dockerfile: ./mcp-webui/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy shared deps (MCP servers only)
        if: matrix.service.name != 'mcp-webui'
        run: |
          mkdir -p ${{ matrix.service.context }}/shared
          cp -r ./mcp-servers/shared/mcp-permission-engine ${{ matrix.service.context }}/shared/mcp-permission-engine
          if [ -d ./mcp-servers/shared/mcp-proxy ]; then
            cp -r ./mcp-servers/shared/mcp-proxy ${{ matrix.service.context }}/shared/mcp-proxy
          fi

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:${{ github.sha }}
          build-args: ${{ matrix.service.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
