# Synology NAS MCP — Permission Configuration Template

server:
  name: synology-mcp
  log_level: INFO
  audit_log: /var/log/mcp/audit.log

ui:
  label: "Synology NAS"
  icon: "💾"
  sections:
    paths: true
    commands: false
    tools: true
    audit: true

connection:
  host: ${SYNOLOGY_NAS_HOST:-}
  port: ${SYNOLOGY_NAS_PORT:-5001}

permissions:
  default_access: none
  paths: []
  commands: []
  default_command_access: none
