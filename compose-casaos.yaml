# compose-casaos.yaml — MCP Stack for CasaOS
#
# Images are built and pushed to ghcr.io automatically when a PR is merged to main
# (.github/workflows/build-push.yml). CasaOS detects new image digests and shows
# an update button on each app icon in the home screen — one click to pull + restart.
#
# Before starting:
#   1. Log in to GHCR:
#        echo "$GITHUB_TOKEN" | docker login ghcr.io -u Piero24 --password-stdin
#   2. Create the directory structure on your host:
#        mkdir -p /DATA/AppData/mcps-server/{shared,ubuntu-server,synology-nas,obsidian,github,mcp-webui,settings}
#        mkdir -p /DATA/AppData/mcps-server/logs/{ubuntu,obsidian,synology,github}
#   3. Copy config templates into settings:
#        cp configs/templates/users.yaml /DATA/AppData/mcps-server/settings/
#        cp configs/templates/ubuntu-server.yaml /DATA/AppData/mcps-server/settings/
#        cp configs/templates/obsidian.yaml /DATA/AppData/mcps-server/settings/
#        cp configs/templates/synology-nas.yaml /DATA/AppData/mcps-server/settings/
#        cp configs/templates/github-mcp.yaml /DATA/AppData/mcps-server/settings/
#   4. Fill in env vars in the CasaOS UI or edit them below.
#   5. Generate API keys for the Web UI:
#        WEBUI_API_KEY=$(openssl rand -hex 32)
#        WEBUI_AUTH_SECRET=$(openssl rand -hex 32)

name: mcp-stack
services:
  # ============================================================
  # UBUNTU MCP — Remote Linux server management
  # ============================================================
  ubuntu-mcp:
    build:
      context: ./mcp-servers/ubuntu-server
      args:
        PERMISSION_ENGINE_PATH: shared/mcp-permission-engine
    image: ghcr.io/piero24/ubuntu-mcp:latest
    container_name: ubuntu-mcp
    stdin_open: true
    restart: unless-stopped
    pid: "host"
    network_mode: "host"
    environment:
      UBUNTU_REMOTE_HOST: ""
      UBUNTU_REMOTE_PORT: "22"
      UBUNTU_REMOTE_USER: ""
    x-casaos:
      envs:
        - container: UBUNTU_REMOTE_HOST
          description:
            en_us: Hostname or IP of the Ubuntu server to manage.
        - container: UBUNTU_REMOTE_PORT
          description:
            en_us: SSH port on the target server (default 22).
        - container: UBUNTU_REMOTE_USER
          description:
            en_us: SSH username for connecting to the target server.
    volumes:
      - type: bind
        source: /home
        target: /mnt/host/home
      - type: bind
        source: /DATA
        target: /mnt/host/DATA
      - type: bind
        source: /etc
        target: /mnt/host/etc
      - type: bind
        source: /var
        target: /mnt/host/var
      - type: bind
        source: /opt
        target: /mnt/host/opt
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /DATA/AppData/mcps-server/settings
        target: /app/configs
      - type: bind
        source: /DATA/AppData/mcps-server/logs/ubuntu
        target: /var/log/mcp
    command: ["python", "-m", "ubuntu_mcp.server", "--config", "/app/configs/ubuntu-server.yaml"]

  # ============================================================
  # OBSIDIAN MCP — Vault file access
  # ============================================================
  obsidian-mcp:
    build:
      context: ./mcp-servers/obsidian
      args:
        PERMISSION_ENGINE_PATH: shared/mcp-permission-engine
    image: ghcr.io/piero24/obsidian-mcp:latest
    container_name: obsidian-mcp
    stdin_open: true
    restart: unless-stopped
    x-casaos:
      envs:
        - container: OBSIDIAN_LOCAL_VAULT_PATH
          description:
            en_us: Path to your Obsidian vault on the host. Mounted read-write so the MCP can read and edit notes.
    volumes:
      - type: bind
        source: ${OBSIDIAN_LOCAL_VAULT_PATH:-/DATA/obsidian-vaults}
        target: /data/vaults
      - type: bind
        source: /DATA/AppData/mcps-server/settings
        target: /app/configs
      - type: bind
        source: /DATA/AppData/mcps-server/logs/obsidian
        target: /var/log/mcp
    command: ["python", "-m", "obsidian_mcp.server", "--config", "/app/configs/obsidian.yaml"]

  # ============================================================
  # SYNOLOGY MCP — NAS management via DSM API
  # ============================================================
  synology-mcp:
    build:
      context: ./mcp-servers/synology-nas
      args:
        PERMISSION_ENGINE_PATH: shared/mcp-permission-engine
    image: ghcr.io/piero24/synology-mcp:latest
    container_name: synology-mcp
    stdin_open: true
    restart: unless-stopped
    environment:
      SYNOLOGY_NAS_HOST: ""
      SYNOLOGY_NAS_PORT: "5001"
      SYNOLOGY_NAS_USER: ""
      SYNOLOGY_NAS_PASSWORD: ""
      SYNOLOGY_NAS_OTP_SECRET: ""
    x-casaos:
      envs:
        - container: SYNOLOGY_NAS_HOST
          description:
            en_us: IP address or hostname of your Synology NAS.
        - container: SYNOLOGY_NAS_PORT
          description:
            en_us: DSM port (default 5001 for HTTPS).
        - container: SYNOLOGY_NAS_USER
          description:
            en_us: Username for DSM login.
        - container: SYNOLOGY_NAS_PASSWORD
          description:
            en_us: Password for DSM login.
        - container: SYNOLOGY_NAS_OTP_SECRET
          description:
            en_us: "Base32 TOTP secret if 2FA is enabled. Copy only the secret= value from your otpauth:// URL. Leave empty if 2FA is disabled."
    volumes:
      - type: bind
        source: /DATA/AppData/mcps-server/settings
        target: /app/configs
      - type: bind
        source: /DATA/AppData/mcps-server/logs/synology
        target: /var/log/mcp
    command: ["python", "-m", "synology_mcp.server", "--config", "/app/configs/synology-nas.yaml"]

  # ============================================================
  # MCP WEB UI — Permission manager dashboard
  # ============================================================
  mcp-webui:
    build:
      context: ./mcp-webui
    image: ghcr.io/piero24/mcp-webui:latest
    container_name: mcp-webui
    restart: unless-stopped
    environment:
      WEBUI_API_KEY: ""
      WEBUI_AUTH_SECRET: ""
      CONFIGS_PATH: /app/configs
      LOGS_PATH: /var/log/mcp
    x-casaos:
      envs:
        - container: WEBUI_API_KEY
          description:
            en_us: "API key for the Web UI login. Generate with: openssl rand -hex 32"
        - container: WEBUI_AUTH_SECRET
          description:
            en_us: "Session encryption secret. Generate with: openssl rand -hex 32"
    ports:
      - target: 8280
        published: 8280
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mcps-server/settings
        target: /app/configs
      - type: bind
        source: /DATA/AppData/mcps-server/logs
        target: /var/log/mcp
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

  # ============================================================
  # GITHUB MCP — GitHub API proxy
  # ============================================================
  github-mcp:
    build:
      context: ./mcp-servers/github
      args:
        PERMISSION_ENGINE_PATH: shared/mcp-permission-engine
        PROXY_PATH: shared/mcp-proxy
    image: ghcr.io/piero24/github-mcp:latest
    container_name: github-mcp
    stdin_open: true
    restart: unless-stopped
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ""
    x-casaos:
      envs:
        - container: GITHUB_PERSONAL_ACCESS_TOKEN
          description:
            en_us: "GitHub personal access token for API operations. Create at GitHub → Settings → Developer settings → Personal access tokens."
    volumes:
      - type: bind
        source: /DATA/AppData/mcps-server/settings
        target: /app/configs
      - type: bind
        source: /DATA/AppData/mcps-server/logs/github
        target: /var/log/mcp
    command: ["python", "-m", "src.server", "--config", "/app/configs/github-mcp.yaml"]

x-casaos:
  architectures:
    - amd64
    - arm64
  main: mcp-webui
  developer: Andrea Pietrobon
  author: Piero24
  icon: https://raw.githubusercontent.com/Piero24/claude-swiss-army-knife/main/.github/icon.png
  thumbnail: https://raw.githubusercontent.com/Piero24/claude-swiss-army-knife/main/.github/icon.png
  title:
    en_us: MCP Stack
  category: Development
  description:
    en_us: >
      A full MCP (Model Context Protocol) server stack with permission management.
      Includes Ubuntu Server MCP for remote Linux management, Obsidian MCP for vault
      access, Synology NAS MCP for DSM control, GitHub MCP for API proxy access,
      and a Web UI dashboard for managing users, permissions, and audit logs.
  tagline:
    en_us: >
      Complete MCP server stack with Web UI.
      Ubuntu, Obsidian, Synology, GitHub — all with permission control.
  port_map: "8280"
