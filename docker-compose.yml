# docker-compose.yml — MCP Servers + Web UI
#
# Usage:
#   cp .env.example .env
#   bash scripts/generate-api-key.sh
#   docker compose up -d --build

services:
  # ============================================================
  # MCP Gateway & Servers
  # ============================================================

  mcp-gateway:
    build:
      context: .
      dockerfile: mcp-servers/shared/mcp-gateway/Dockerfile
    image: mcp-gateway:latest
    container_name: mcp-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8281:8280"


    volumes:
      - ./configs:/app/configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MCP_LOG_DIR:-/var/log/mcp}:/var/log/mcp
    environment:
      - SECURITY_WEBHOOK_URL=${SECURITY_WEBHOOK_URL:-}
    restart: unless-stopped

  ubuntu-mcp:
    build:
      context: .
      dockerfile: mcp-servers/ubuntu-server/Dockerfile
    image: ubuntu-mcp:${UBUNTU_MCP_IMAGE_TAG:-latest}
    container_name: ${UBUNTU_MCP_CONTAINER:-ubuntu-mcp}
    volumes:
      # Host mounts (Linux filesystem access)
      - ${UBUNTU_HOST_HOME:-/home}:/mnt/host/home:rw
      - ${UBUNTU_HOST_DATA:-/DATA}:/mnt/host/DATA:rw
      - ${UBUNTU_HOST_ETC:-/etc}:/mnt/host/etc:rw
      - ${UBUNTU_HOST_VAR:-/var}:/mnt/host/var:rw
      - ${UBUNTU_HOST_OPT:-/opt}:/mnt/host/opt:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/ubuntu-server:/app/configs/ubuntu-server:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ./configs/settings.json:/app/configs/settings.json:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/ubuntu-server:/var/log/mcp
    command: ["--config-dir", "/app/configs/ubuntu-server"]
    environment:
      - UBUNTU_REMOTE_HOST=${UBUNTU_REMOTE_HOST:-}
      - UBUNTU_REMOTE_PORT=${UBUNTU_REMOTE_PORT:-22}
      - UBUNTU_REMOTE_USER=${UBUNTU_REMOTE_USER:-}
      - LOG_LEVEL=${UBUNTU_MCP_LOG_LEVEL:-INFO}
    pid: "host"
    network_mode: "host"
    stdin_open: true
    restart: unless-stopped

  obsidian-mcp:
    build:
      context: .
      dockerfile: mcp-servers/obsidian/Dockerfile
    image: obsidian-mcp:${OBSIDIAN_MCP_IMAGE_TAG:-latest}
    container_name: ${OBSIDIAN_MCP_CONTAINER:-obsidian-mcp}
    volumes:
      # Vault mount
      - ${OBSIDIAN_LOCAL_VAULT_PATH:-/DATA/obsidian-vaults}:/data/vaults:rw
      - ./configs/obsidian:/app/configs/obsidian:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ./configs/settings.json:/app/configs/settings.json:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/obsidian:/var/log/mcp
    command: ["--config-dir", "/app/configs/obsidian"]
    environment:
      - LOG_LEVEL=${OBSIDIAN_MCP_LOG_LEVEL:-WARNING}
    stdin_open: true
    restart: unless-stopped

  synology-mcp:
    build:
      context: .
      dockerfile: mcp-servers/synology-nas/Dockerfile
    image: synology-mcp:${SYNOLOGY_MCP_IMAGE_TAG:-latest}
    container_name: ${SYNOLOGY_MCP_CONTAINER:-synology-mcp}
    volumes:
      - ./configs/synology-nas:/app/configs/synology-nas:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ./configs/settings.json:/app/configs/settings.json:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/synology-nas:/var/log/mcp
    command: ["--config-dir", "/app/configs/synology-nas"]
    environment:
      - SYNOLOGY_NAS_HOST=${SYNOLOGY_NAS_HOST}
      - SYNOLOGY_NAS_PORT=${SYNOLOGY_NAS_PORT}
      - SYNOLOGY_NAS_USER=${SYNOLOGY_NAS_USER}
      - SYNOLOGY_NAS_PASSWORD=${SYNOLOGY_NAS_PASSWORD}
      - SYNOLOGY_NAS_OTP_SECRET=${SYNOLOGY_NAS_OTP_SECRET:-}
      - LOG_LEVEL=${SYNOLOGY_MCP_LOG_LEVEL:-INFO}
    stdin_open: true
    restart: unless-stopped

  # ============================================================
  # Web UI — Permission Manager (Next.js 15 / TypeScript)
  # ============================================================

  mcp-webui:
    build:
      context: ./mcp-webui
    image: mcp-webui:${WEBUI_IMAGE_TAG:-latest}
    container_name: mcp-webui
    volumes:
      - ./configs:/app/configs:rw
      - ./scripts/server:/app/scripts:rw
      - ${MCP_LOG_DIR:-/var/log/mcp}:/var/log/mcp:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WEBUI_API_KEY=${WEBUI_API_KEY}
      - WEBUI_AUTH_SECRET=${WEBUI_AUTH_SECRET}
      - CONFIGS_PATH=/app/configs
      - LOGS_PATH=/var/log/mcp
      - SCRIPTS_PATH=/app/scripts
      - LOG_LEVEL=${WEBUI_LOG_LEVEL:-INFO}
    ports:
      - "${WEBUI_PORT:-8280}:8280"
    restart: unless-stopped

  # ============================================================
  # MCP Proxy — GitHub
  # ============================================================

  github-mcp:
    build:
      context: .
      dockerfile: mcp-servers/github/Dockerfile
    image: github-mcp:${GITHUB_MCP_IMAGE_TAG:-latest}
    container_name: ${GITHUB_MCP_CONTAINER:-github-mcp}
    volumes:
      - ./configs/github-mcp:/app/configs/github-mcp:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ./configs/settings.json:/app/configs/settings.json:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/github-mcp:/var/log/mcp
    command: ["--config-dir", "/app/configs/github-mcp"]
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN:-}
      - LOG_LEVEL=${GITHUB_MCP_LOG_LEVEL:-WARNING}
    stdin_open: true
    restart: unless-stopped

  # ============================================================
  # Link Manager MCP — Curated website and documentation links
  # ============================================================

  link-manager:
    build:
      context: .
      dockerfile: mcp-servers/link-manager/Dockerfile
    image: link-manager-mcp:${LINK_MANAGER_IMAGE_TAG:-latest}
    container_name: ${LINK_MANAGER_CONTAINER:-link-manager}
    volumes:
      - ./configs/link-manager:/app/configs/link-manager:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ./configs/settings.json:/app/configs/settings.json:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/link-manager:/var/log/mcp
    command: ["--config-dir", "/app/configs/link-manager"]
    environment:
      - LOG_LEVEL=${LINK_MANAGER_LOG_LEVEL:-INFO}
    stdin_open: true
    restart: unless-stopped

  # ============================================================
  # Beszel Agent — System metrics
  # ============================================================
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: mcp-beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: "${BESZEL_LISTEN_PORT:-45003}"
      KEY: "${BESZEL_KEY:-}"
      EXTRA_FILESYSTEMS: /dev/sda1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro