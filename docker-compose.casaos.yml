# docker-compose.casaos.yml — Registry-only compose for CasaOS
#
# This file uses pre-built images from GitHub Container Registry.
# When a PR is merged to main, the build-push workflow pushes new
# images to ghcr.io, CasaOS detects the digest change, and the
# update button appears on each app icon in the home screen.
#
# Usage on CasaOS host:
#   echo "$GITHUB_TOKEN" | docker login ghcr.io -u Piero24 --password-stdin
#   docker compose -f docker-compose.casaos.yml pull
#   docker compose -f docker-compose.casaos.yml up -d

x-casaos:
  author: Piero24
  category: Utilities
  title:
    en_us: MCP Stack

services:
  # ============================================================
  # MCP Servers
  # ============================================================

  ubuntu-mcp:
    image: ghcr.io/piero24/ubuntu-mcp:latest
    container_name: ${UBUNTU_MCP_CONTAINER:-ubuntu-mcp}
    volumes:
      - /home:/mnt/host/home:rw
      - /var/www:/mnt/host/var/www:rw
      - /var/log:/mnt/host/var/log:ro
      - /etc/nginx:/mnt/host/etc/nginx:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/ubuntu-server.yaml:/app/config.yaml:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/ubuntu:/var/log/mcp
      - ${UBUNTU_REMOTE_KEY:-~/.ssh/id_ed25519}:/app/keys/ssh_key:ro
    environment:
      - UBUNTU_REMOTE_HOST=${UBUNTU_REMOTE_HOST:-}
      - UBUNTU_REMOTE_PORT=${UBUNTU_REMOTE_PORT:-22}
      - UBUNTU_REMOTE_USER=${UBUNTU_REMOTE_USER:-}
      - UBUNTU_REMOTE_KEY=${UBUNTU_REMOTE_KEY:-}
    pid: "host"
    network_mode: "host"
    stdin_open: true
    restart: unless-stopped

  obsidian-mcp:
    image: ghcr.io/piero24/obsidian-mcp:latest
    container_name: ${OBSIDIAN_MCP_CONTAINER:-obsidian-mcp}
    volumes:
      - ${OBSIDIAN_LOCAL_VAULT_PATH:-obsidian-vault-data}:/data/vaults:rw
      - ./configs/obsidian.yaml:/app/config.yaml:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/obsidian:/var/log/mcp
    environment:
      - OBSIDIAN_LOCAL_VAULT_PATH=${OBSIDIAN_LOCAL_VAULT_PATH:-}
    stdin_open: true
    restart: unless-stopped

  synology-mcp:
    image: ghcr.io/piero24/synology-mcp:latest
    container_name: ${SYNOLOGY_MCP_CONTAINER:-synology-mcp}
    volumes:
      - ./configs/synology-nas.yaml:/app/config.yaml:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/synology:/var/log/mcp
    environment:
      - SYNOLOGY_NAS_HOST=${SYNOLOGY_NAS_HOST}
      - SYNOLOGY_NAS_PORT=${SYNOLOGY_NAS_PORT}
      - SYNOLOGY_NAS_USER=${SYNOLOGY_NAS_USER}
      - SYNOLOGY_NAS_PASSWORD=${SYNOLOGY_NAS_PASSWORD}
      - SYNOLOGY_NAS_OTP_SECRET=${SYNOLOGY_NAS_OTP_SECRET:-}
    stdin_open: true
    restart: unless-stopped

  # ============================================================
  # Web UI — Permission Manager
  # ============================================================

  mcp-webui:
    image: ghcr.io/piero24/mcp-webui:latest
    container_name: mcp-webui
    volumes:
      - ./configs:/app/configs:rw
      - ${MCP_LOG_DIR:-/var/log/mcp}:/var/log/mcp:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WEBUI_API_KEY=${WEBUI_API_KEY}
      - WEBUI_AUTH_SECRET=${WEBUI_AUTH_SECRET}
      - CONFIGS_PATH=/app/configs
      - LOGS_PATH=/var/log/mcp
    ports:
      - "${WEBUI_PORT:-8280}:8280"
    restart: unless-stopped

  # ============================================================
  # MCP Proxy — GitHub
  # ============================================================

  github-mcp:
    image: ghcr.io/piero24/github-mcp:latest
    container_name: ${GITHUB_MCP_CONTAINER:-github-mcp}
    volumes:
      - ./configs/github-mcp.yaml:/app/config.yaml:ro
      - ./configs/users.yaml:/app/users.yaml:ro
      - ${MCP_LOG_DIR:-/var/log/mcp}/github:/var/log/mcp
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN:-}
    stdin_open: true
    restart: unless-stopped

volumes:
  obsidian-vault-data:
